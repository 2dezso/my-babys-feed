# Builds the iPhone app on a GitHub cloud Mac and sends it to App Store Connect, where it appears in TestFlight.
# It only runs when started by hand: GitHub, Actions tab, "iPhone build", Run workflow.
# Tick "Practice run" to check the build works without any Apple account; it signs and sends nothing.
#
# Needs four repository secrets (Settings, Secrets and variables, Actions). See "iPhone app: cloud build" in docs/SETUP.md.
#   APPLE_TEAM_ID      your 10-character Apple team ID
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         the contents of the downloaded AuthKey_XXXXXX.p8 file
name: iPhone build

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Practice run, no Apple account needed. Builds without signing and sends nothing
        type: boolean
        default: false
      upload:
        description: Send the build to App Store Connect (TestFlight)
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the wrapper
        run: npm install

      - name: Make the iPhone project
        run: bash scripts/ios-prepare.sh

      - name: Write the App Store Connect key
        if: ${{ !inputs.check_only }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8" || { echo "ASC_KEY_P8 secret is empty"; exit 1; }

      # The archive is built unsigned. Signing happens when it is exported below, which needs no registered test device;
      # an automatically signed archive fails on a team that has never registered one ("no devices from which to
      # generate a provisioning profile").
      - name: Build the archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Capacitor makes a workspace when it uses CocoaPods, or a plain project when it uses Swift packages.
          if [ -d ios/App/App.xcworkspace ]; then SRC=(-workspace ios/App/App.xcworkspace); else SRC=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${SRC[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Check the app holds what Apple needs
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleDisplayName|CFBundleIdentifier|NSCameraUsageDescription|NSPhotoLibraryUsageDescription|ITSAppUsesNonExemptEncryption|UIDeviceFamily|UISupportedInterfaceOrientations" -A 2
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "privacy file: present" || { echo "privacy file: MISSING"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -q NSCameraUsageDescription || { echo "camera reason: MISSING"; exit 1; }
          test -f "$APP/public/index.html" && echo "web files: present" || { echo "web files: MISSING"; exit 1; }

      - name: Send to App Store Connect
        if: ${{ inputs.upload && !inputs.check_only }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Keep the build logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ~/Library/Logs/gym/
          if-no-files-found: ignore
